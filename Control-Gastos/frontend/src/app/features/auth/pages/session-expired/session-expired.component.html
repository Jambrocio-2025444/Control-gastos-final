<div *ngIf="sessionExpired$ | async" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md animate-fade-in">
  
  
  <div class="w-full max-w-sm rounded-3xl bg-[#04201a]/90 border border-emerald-800/50 p-8 shadow-2xl shadow-black/60 backdrop-blur-xl relative overflow-hidden text-center">
    
    
    <div class="absolute w-40 h-40 rounded-full bg-[#10b981]/15 blur-2xl -top-10 -right-10 pointer-events-none" aria-hidden="true"></div>

    
    <div class="w-16 h-16 mx-auto rounded-2xl bg-emerald-950/80 border border-emerald-800/40 flex items-center justify-center text-emerald-300/80 shadow-inner">
      <svg class="w-8 h-8 text-[#10b981]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 8v4l2.5 2.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>

    
    <h2 class="font-display text-2xl font-bold text-white tracking-tight mt-5">
      Tu sesión ha caducado
    </h2>
    <p class="text-emerald-100/70 text-xs sm:text-sm mt-2 leading-relaxed">
      Por seguridad, cerramos tu sesión automáticamente.<br />
      Inicia sesión nuevamente para continuar.
    </p>

    
    <button
      (click)="onAccept()"
      class="w-full bg-gradient-to-r from-[#083b2f] to-[#10b981] text-white py-3.5 px-6 rounded-2xl font-display font-semibold text-sm hover:opacity-95 hover:shadow-lg hover:shadow-[#10b981]/20 transition-all duration-200 mt-7 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#10b981] focus-visible:ring-offset-2 focus-visible:ring-offset-[#04201a]"
    >
      Iniciar sesión
    </button>
  </div>

</div>
