  <div *ngIf="sessionExpired$ | async" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md animate-fade-in">


  <div class="w-full max-w-sm rounded-3xl bg-finance-forest/95 border border-finance-bright/20 p-8 shadow-2xl shadow-black/60 backdrop-blur-xl relative overflow-hidden text-center">


    <div class="absolute w-40 h-40 rounded-full bg-finance-bright/15 blur-2xl -top-10 -right-10 pointer-events-none" aria-hidden="true"></div>


    <div class="w-16 h-16 mx-auto rounded-2xl bg-finance-forest border border-finance-bright/30 flex items-center justify-center text-finance-bright/80 shadow-inner">
      <svg class="w-8 h-8 text-finance-bright" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 8v4l2.5 2.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>


    <h2 class="font-display text-2xl font-bold text-white tracking-tight mt-5">
      Su sesión ha caducado
    </h2>
    <p class="text-finance-pale/80 text-xs sm:text-sm mt-2 leading-relaxed">
      Por seguridad, cerramos su sesión automáticamente.<br />
      Inicia sesión nuevamente para continuar.
    </p>


    <button
      (click)="onAccept()"
      class="w-full bg-gradient-to-r from-finance-forest to-finance-bright text-white py-3.5 px-6 rounded-2xl font-display font-semibold text-sm hover:opacity-95 hover:shadow-lg hover:shadow-finance-bright/20 transition-all duration-200 mt-7 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-finance-bright focus-visible:ring-offset-2 focus-visible:ring-offset-finance-forest"
    >
      Iniciar sesión
    </button>
  </div>

</div>
